spring:
  application:
    name: ms-customer
  datasource:
    # database datasource
    url: jdbc:h2:mem:customerdb
  h2:
    console:
      # display database on H2 console
      enabled: true
      path: /h2-console
  jpa:
    # display sql request on console
    show-sql: true
  cloud:
    config:
      # disabled subscription to eureka and config service
      enabled: false
    discovery:
      enabled: false

server:
  port: 8000