spring.application.name=ms-account
# Le port du customer service = 8000
server.port=8100

# Database datasource
spring.datasource.url=jdbc:h2:mem:accountdb

# Display database on H2 console
spring.h2.console.enabled=true

# Display SQL requests on console
spring.jpa.show-sql=true

# Disable subscription to Eureka and Config Server
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false